<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Profile: Zakaria Rebbah, AI and Data Engineer, open to a PFE internship from January 2027" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="c1"><rect x="30" y="76" width="0" height="64"><animate attributeName="width" from="0" to="1140" dur="1.1s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="30" y="148" width="0" height="64"><animate attributeName="width" from="0" to="1140" dur="1.3s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="30" y="220" width="0" height="64"><animate attributeName="width" from="0" to="1140" dur="1.1s" begin="3.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="30" y="292" width="0" height="64"><animate attributeName="width" from="0" to="1140" dur="1.5s" begin="5.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .p { fill: #38bdf8; font-size: 17px; }
    .cmd { fill: #e2e8f0; font-size: 17px; }
    .out { fill: #94a3b8; font-size: 17px; }
    .hi { fill: #f8fafc; font-weight: 700; }
    .ac { fill: #818cf8; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Fenetre -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="#0a1022" stroke="#1e2a4d"/>
  <path d="M0.5 36 V14.5 A14 14 0 0 1 14.5 0.5 H1185.5 A14 14 0 0 1 1199.5 14.5 V36 Z" fill="#0d162e"/>
  <line x1="0" y1="36.5" x2="1200" y2="36.5" stroke="#1e2a4d"/>
  <circle cx="26" cy="18" r="5.5" fill="#334155"/>
  <circle cx="46" cy="18" r="5.5" fill="#334155"/>
  <circle cx="66" cy="18" r="5.5" fill="#334155"/>
  <text x="600" y="23" text-anchor="middle" class="mono" font-size="13" fill="#64748b" letter-spacing="1">zakaria@ensa-el-jadida: ~</text>
  <rect x="0" y="36" width="1200" height="2" fill="url(#accent)" opacity="0.7"/>

  <!-- Bloc 1 -->
  <g clip-path="url(#c1)" class="mono">
    <text x="40" y="104"><tspan class="p">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="40" y="132" class="out"><tspan class="hi">Zakaria Rebbah</tspan>  /  AI &amp; Data Engineer  /  ENSA El Jadida, class of 2027</text>
  </g>

  <!-- Bloc 2 -->
  <g clip-path="url(#c2)" class="mono">
    <text x="40" y="176"><tspan class="p">$ </tspan><tspan class="cmd">focus --list</tspan></text>
    <text x="40" y="204" class="out">big data  <tspan class="ac">+</tspan>  machine learning  <tspan class="ac">+</tspan>  rag systems  <tspan class="ac">+</tspan>  computer vision</text>
  </g>

  <!-- Bloc 3 -->
  <g clip-path="url(#c3)" class="mono">
    <text x="40" y="248"><tspan class="p">$ </tspan><tspan class="cmd">build --principle</tspan></text>
    <text x="40" y="276" class="out">ship <tspan class="hi">systems</tspan>, not notebooks.  raw data in, <tspan class="hi">decisions</tspan> out.</text>
  </g>

  <!-- Bloc 4 -->
  <g clip-path="url(#c4)" class="mono">
    <text x="40" y="320"><tspan class="p">$ </tspan><tspan class="cmd">status</tspan></text>
    <text x="40" y="348" class="out"><tspan class="hi">open to</tspan> a 6-month PFE internship  /  starting <tspan class="hi">January 2027</tspan></text>
  </g>

  <!-- Curseur final -->
  <g visibility="hidden">
    <set attributeName="visibility" to="visible" begin="6.7s" fill="freeze"/>
    <rect class="cursor" x="640" y="334" width="10" height="18" fill="#38bdf8"/>
  </g>
</svg>
