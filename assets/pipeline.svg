<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Pipeline: Ingest, Refine, Model, Serve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
  </style>

  <rect width="1200" height="260" rx="14" fill="#0a1022"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#1e2a4d"/>

  <!-- Liens animés -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path class="flow" d="M276 130 H322"/>
    <path class="flow" d="M576 130 H622"/>
    <path class="flow" d="M876 130 H922"/>
  </g>
  <g fill="#38bdf8">
    <path d="M322 124 L334 130 L322 136 Z"/>
    <path d="M622 124 L634 130 L622 136 Z"/>
    <path d="M922 124 L934 130 L922 136 Z"/>
  </g>

  <!-- Noeud 1 -->
  <rect x="30" y="50" width="246" height="160" rx="10" fill="#101a36" stroke="#cd7f32" stroke-opacity="0.7"/>
  <rect x="30" y="50" width="246" height="5" rx="2" fill="#cd7f32"/>
  <text x="52" y="86" class="mono" font-size="12" fill="#cd7f32" letter-spacing="2">01 / BRONZE</text>
  <text x="52" y="118" class="sans" font-size="26" font-weight="700" fill="#f1f5f9">Ingest</text>
  <text x="52" y="148" class="mono" font-size="14" fill="#cbd5e1">HDFS · Kafka</text>
  <text x="52" y="168" class="mono" font-size="14" fill="#cbd5e1">Talend · Oracle</text>
  <text x="52" y="194" class="sans" font-size="13" fill="#64748b">Données brutes, à grande échelle</text>

  <!-- Noeud 2 -->
  <rect x="330" y="50" width="246" height="160" rx="10" fill="#101a36" stroke="#c0c8d4" stroke-opacity="0.7"/>
  <rect x="330" y="50" width="246" height="5" rx="2" fill="#c0c8d4"/>
  <text x="352" y="86" class="mono" font-size="12" fill="#c0c8d4" letter-spacing="2">02 / SILVER</text>
  <text x="352" y="118" class="sans" font-size="26" font-weight="700" fill="#f1f5f9">Refine</text>
  <text x="352" y="148" class="mono" font-size="14" fill="#cbd5e1">PySpark · Spark SQL</text>
  <text x="352" y="168" class="mono" font-size="14" fill="#cbd5e1">Parquet · Pandas</text>
  <text x="352" y="194" class="sans" font-size="13" fill="#64748b">Nettoyage, profilage, schéma</text>

  <!-- Noeud 3 -->
  <rect x="630" y="50" width="246" height="160" rx="10" fill="#101a36" stroke="#38bdf8" stroke-opacity="0.7"/>
  <rect x="630" y="50" width="246" height="5" rx="2" fill="#38bdf8"/>
  <text x="652" y="86" class="mono" font-size="12" fill="#38bdf8" letter-spacing="2">03 / INTELLIGENCE</text>
  <text x="652" y="118" class="sans" font-size="26" font-weight="700" fill="#f1f5f9">Model</text>
  <text x="652" y="148" class="mono" font-size="14" fill="#cbd5e1">scikit-learn · PyTorch</text>
  <text x="652" y="168" class="mono" font-size="14" fill="#cbd5e1">YOLO · LangChain</text>
  <text x="652" y="194" class="sans" font-size="13" fill="#64748b">Prédiction, détection, RAG</text>

  <!-- Noeud 4 -->
  <rect x="930" y="50" width="246" height="160" rx="10" fill="#101a36" stroke="#f5c542" stroke-opacity="0.7"/>
  <rect x="930" y="50" width="246" height="5" rx="2" fill="#f5c542"/>
  <text x="952" y="86" class="mono" font-size="12" fill="#f5c542" letter-spacing="2">04 / GOLD</text>
  <text x="952" y="118" class="sans" font-size="26" font-weight="700" fill="#f1f5f9">Serve</text>
  <text x="952" y="148" class="mono" font-size="14" fill="#cbd5e1">PostgreSQL · API REST</text>
  <text x="952" y="168" class="mono" font-size="14" fill="#cbd5e1">Power BI · React</text>
  <text x="952" y="194" class="sans" font-size="13" fill="#64748b">Dashboards, assistants, décisions</text>

  <text x="600" y="240" text-anchor="middle" class="mono" font-size="12" fill="#475569" letter-spacing="2">DE LA DONNÉE BRUTE À LA DÉCISION</text>
</svg>
