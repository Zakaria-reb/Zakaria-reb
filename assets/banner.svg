<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zakaria Rebbah, AI and Data Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#0e1a3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <path id="p1" d="M770 215 C 830 215, 830 110, 900 110"/>
    <path id="p2" d="M900 110 C 960 110, 960 200, 1030 200"/>
    <path id="p3" d="M1030 200 C 1080 200, 1080 90, 1140 90"/>
    <path id="p4" d="M770 215 C 850 215, 940 60, 1030 60"/>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .flow { stroke-dasharray: 5 7; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="300" fill="url(#accent)"/>

  <!-- Texte -->
  <text x="70" y="78" class="mono" font-size="15" fill="#38bdf8" letter-spacing="3">AI &amp; DATA ENGINEERING</text>
  <text x="68" y="150" class="sans" font-size="68" font-weight="700" fill="#f8fafc" letter-spacing="-1">Zakaria Rebbah</text>
  <rect x="70" y="170" width="90" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="208" class="sans" font-size="21" fill="#94a3b8">Pipelines Big Data, Machine Learning</text>
  <text x="70" y="236" class="sans" font-size="21" fill="#94a3b8">et systèmes RAG pensés pour la production.</text>
  <text x="70" y="275" class="mono" font-size="14" fill="#64748b">$ ENSA El Jadida --promo 2027 --pfe janvier-2027</text>
  <rect class="cursor" x="475" y="263" width="9" height="16" fill="#38bdf8"/>

  <!-- Graphe de flux de données -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5">
    <use href="#p1" class="flow"/>
    <use href="#p2" class="flow"/>
    <use href="#p3" class="flow"/>
    <use href="#p4" class="flow" stroke="#818cf8"/>
  </g>

  <g>
    <circle r="3.5" fill="#f8fafc"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="3.5" fill="#f8fafc"><animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="3.5" fill="#f8fafc"><animateMotion dur="3.2s" begin="2.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="3" fill="#a5b4fc"><animateMotion dur="4s" begin="0.5s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  </g>

  <g>
    <circle cx="770" cy="215" r="9" fill="#cd7f32"/>
    <circle cx="900" cy="110" r="9" fill="#c0c8d4"/>
    <circle cx="1030" cy="200" r="9" fill="#38bdf8"/>
    <circle cx="1140" cy="90" r="9" fill="#f5c542"/>
    <circle cx="1030" cy="60" r="7" fill="#818cf8"/>
    <circle class="pulse" cx="770" cy="215" r="18" fill="none" stroke="#cd7f32" stroke-opacity="0.5"/>
    <circle class="pulse" cx="1140" cy="90" r="18" fill="none" stroke="#f5c542" stroke-opacity="0.5"/>
  </g>
  <g class="mono" font-size="12" fill="#64748b" letter-spacing="1.5">
    <text x="745" y="248">BRONZE</text>
    <text x="875" y="143">SILVER</text>
    <text x="1008" y="233">MODEL</text>
    <text x="1118" y="123">GOLD</text>
  </g>
</svg>
